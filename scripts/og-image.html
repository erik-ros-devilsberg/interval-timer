<!doctype html>
<!-- Source for public/og-image.png (1200×630 link preview). Regenerate with `npm run og`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 1fr 360px;
        align-items: center;
        gap: 40px;
        padding: 0 80px 0 90px;
        box-sizing: border-box;
        background: #1e3b32;
        color: #d3dbc8;
        font-family: 'Bricolage', sans-serif;
      }
      h1 { margin: 0 0 24px; font-size: 92px; font-weight: 700; line-height: 0.95; letter-spacing: -0.03em; }
      p { margin: 0; font-size: 34px; line-height: 1.3; opacity: 0.85; }
      .tags { margin-top: 40px; display: flex; gap: 14px; }
      .tags span {
        padding: 10px 22px;
        border: 2px solid #d3dbc8;
        border-radius: 999px;
        font-size: 26px;
        font-weight: 600;
      }
      .phone {
        width: 280px;
        border-radius: 32px;
        border: 3px solid rgb(211 219 200 / 0.35);
        box-shadow: 0 30px 60px rgb(0 0 0 / 0.35);
        justify-self: center;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Interval Timer</h1>
      <p>Workouts, focus sprints, or flipping steaks evenly. A gentle 3-2-1 beep keeps your eyes free.</p>
      <div class="tags"><span>Free</span><span>No trackers</span><span>Works offline</span></div>
    </div>
    <img class="phone" src="../public/screenshot.png" alt="" />
  </body>
</html>
